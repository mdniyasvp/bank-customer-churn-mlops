services:
  fastapi:
    build:
      context: .
      dockerfile: docker/Dockerfile.api

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  streamlit:
    depends_on:
      fastapi:
        condition: service_healthy